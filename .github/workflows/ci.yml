name: SQA Continuous Integration

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 12345
          MYSQL_DATABASE: social_media
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- CONFIGURAÇÃO E TESTE DO BACKEND (API) ----
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Build and Run Backend Tests
        run: |
          cd api
          mvn clean test

      # ---- CONFIGURAÇÃO E TESTE DO FRONTEND (CLIENT) ----
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd client
          npm ci

      - name: Run Jest Tests
        run: |
          cd client
          npm run test

      # ---- INICIAR APLICAÇÃO LOCAL E RODAR PLAYWRIGHT ----
      - name: Start Services and Run E2E Tests
        run: |
          # 1. Inicia a API em background
          cd api
          mvn spring-boot:run &

          # 2. Vai para a pasta client, monta o build e inicia o frontend em background
          cd ../client
          npm run build
          npm run start &

          # 3. Vai para a pasta dos testes E2E, instala as dependências isoladas e roda o Playwright
          cd ../tests
          npm ci
          npx playwright install --with-deps
          npm run test
